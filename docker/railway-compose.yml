version: "3.8"
# Full-stack Railway deployment via Docker Compose.
# Deploy with: railway up --compose docker/railway-compose.yml
#
# Or use Railway's UI to add MariaDB and Redis as service plugins,
# then deploy only the `hrms` service with the root Dockerfile.

services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hrms:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Database
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-hrmsdb}
      # Redis
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis:6379
      REDIS_SOCKETIO_URL: redis://redis:6379
      # App
      SITE_NAME: ${SITE_NAME:-hrms.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-17}
      ERPNEXT_BRANCH: ${ERPNEXT_BRANCH:-version-17}
      HRMS_BRANCH: ${HRMS_BRANCH:-main}
      HRMS_REPO: ${HRMS_REPO:-https://github.com/kamesh231/hrms-frappe.git}
    volumes:
      - bench-data:/home/frappe/frappe-bench
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadb-data:
  redis-data:
  bench-data:
